<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f5f5f5;
            text-align: center;
        }

        .result h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .sentiment {
            font-size: 28px;
            font-weight: bold;
        }

        .examples {
            margin-top: 25px;
        }

        .examples h3 {
            color: #444;
            margin-bottom: 10px;
        }

        .examples p {
            background: #f1f1f1;
            padding: 8px;
            margin: 5px 0;
            border-radius: 6px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Sentiment Analysis</h1>

        <p class="subtitle">
            Using Ensemble Learning
        </p>

        <form method="POST">

            <textarea
                name="text"
                placeholder="Enter a tweet or sentence..."
                required
            ></textarea>

            <button type="submit">
                Analyze Sentiment
            </button>

        </form>

        {% if prediction %}

        <div class="result">

            <h2>Prediction</h2>

            <div class="sentiment">
                {{ prediction }}
            </div>

        </div>

        {% endif %}

        <div class="examples">

            <h3>Example Inputs</h3>

            <p>😊 I really love this game</p>

            <p>😡 I hate this product</p>

            <p>😐 The game is okay</p>

        </div>

    </div>

</body>
</html>
